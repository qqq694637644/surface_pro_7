name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Parse config and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from sp7_powerlab.config import (
              load_config,
              load_envelope_config,
              load_machine,
              load_thermal_config,
          )

          root = Path.cwd()
          load_config(root)
          load_machine(root)
          load_envelope_config(root)
          load_thermal_config(root)
          for path in (root / "schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("config/schema parse ok")
          PY

      - name: CLI smoke
        run: |
          cat >/tmp/sp7-powerlab-ci.toml <<'EOF'
          [storage]
          database = "/tmp/sp7-powerlab-ci.sqlite3"

          [activity]
          enabled = false

          [helper]
          enabled = false
          EOF
          sp7-powerlab --help
          sp7-powerlab --config /tmp/sp7-powerlab-ci.toml doctor
          sp7-powerlab --config /tmp/sp7-powerlab-ci.toml envelope list

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w /tmp/powerlab-wheel

      - name: Validate shell syntax
        run: bash -n scripts/*.sh
