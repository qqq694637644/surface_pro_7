name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: Parse config and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from sp7_powerlab.config import load_config
          from sp7_powerlab.profiles import ProfileRegistry

          root = Path.cwd()
          load_config(root)
          ProfileRegistry(root).load()
          for path in (root / "schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("config/schema parse ok")
          PY

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w /tmp/powerlab-wheel

      - name: Validate shell syntax
        run: bash -n scripts/*.sh
