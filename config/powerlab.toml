[collector]
sample_seconds = 10
process_seconds = 30
process_seconds_stable = 120
process_seconds_trial = 10
gpu_seconds = 30
gpu_seconds_stable = 120
gpu_seconds_trial = 10
device_seconds = 60
device_seconds_stable = 300
device_seconds_trial = 30
activity_seconds = 30
activity_seconds_stable = 120
activity_seconds_trial = 10
diagnostic_burst_seconds = 300
rollup_seconds = 60
max_gap_seconds = 45
top_processes = 10

[controller]
minimum_dwell_seconds = 60
resume_grace_seconds = 45
reconcile_seconds = 60
low_battery_percent = 15

[unexpected_power]
window_minutes = 5
min_baselines = 8
relative_threshold = 0.20
absolute_threshold_w = 0.8

[experiments]
min_block_seconds = 300
named_min_block_seconds = 600
settle_min_seconds = 30
settle_max_seconds = 300
settle_min_samples = 3
settle_window_seconds = 30
settle_max_temp_slope_c_per_min = 1.0
settle_max_rapl_range_w = 1.5
settle_max_cpu_psi = 5.0
max_brightness_delta = 10
min_power_saving_w = 0.10
max_cpu_psi_delta = 2.0
max_io_psi_delta = 2.0
max_thermal_pressure_delta = 0.10
max_media_drop = 0.05
max_sustained_compute_delta = 0.10

[evidence]
semantics_version = 8
practical_threshold_w = 0.10
min_crossover_episodes = 2
medium_effect_min_crossover_episodes = 3
large_effect_multiplier = 2.0
direction_consistency = 0.75
reference_min_windows = 8
reference_min_valid_fraction = 0.80
max_energy_consistency_ratio = 0.35
max_energy_consistency_abs_wh = 0.05
gauge_quantum_multiplier = 8.0
measurement_min_samples = 30
measurement_min_observation_seconds = 900
measurement_min_consistency_windows = 2
noise_arm_confidence_multiplier = 2.0

[net_benefit]
max_brightness_delta_pct = 10.0
max_active_fraction_delta = 0.15
max_media_fraction_delta = 0.10
max_remote_fraction_delta = 0.10
max_network_mbps_delta = 5.0
max_mean_temp_delta_c = 5.0
max_reference_drift_w = 0.30
max_candidate_delta_spread_w = 0.30
max_interblock_gap_seconds = 900
max_campaign_span_seconds = 86400

[calibration]
cold_idle_min_seconds = 900
normal_interactive_min_seconds = 1800
media_min_seconds = 600
bounded_burst_min_seconds = 30

[automation]
# 0=read only, 1=verified control, 2=assisted trials,
# 3=low-risk autonomous trials, 4=eligible auto-promotion.
level = 0
auto_promote = false

[storage]
database = "runtime/powerlab.sqlite3"
raw_retention_days = 30

[review]
history_hours = 24
max_incidents = 20
max_trials = 20

[activity]
# Attribution only. The controller does not depend on ActivityWatch.
enabled = true
server_url = "http://127.0.0.1:5600"
timeout_seconds = 1.0
store_window_title = true

[helper]
enabled = true
socket = "/run/sp7-powerlab/helper.sock"

[minimal_meter]
sample_seconds = 60

[scheduler]
min_noise_windows = 8
min_cpu_rapl_w = 0.5
max_perf_step_pct = 5
min_max_perf_pct = 30
max_max_perf_pct = 100
allow_turbo_off = true
max_candidate_trials = 2
max_trials_per_week = 4
max_candidate_minutes_per_day = 30
negative_feedback_cooldown_seconds = 86400
thermal_event_cooldown_seconds = 21600
check_seconds = 60

[stable]
coverage_days = 30
target_trusted_fraction = 0.90
minimum_total_valid_usage_seconds = 28800
minimum_total_trusted_usage_seconds = 25920
minimum_distinct_usage_days = 5
minimum_observation_span_days = 7
feedback_lookback_days = 7

[drift]
minimum_recent_windows = 8
absolute_threshold_w = 0.30
relative_threshold = 0.08
noise_multiplier = 2.0
cooldown_seconds = 21600
